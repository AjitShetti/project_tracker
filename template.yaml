AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Side Project Tracker API — FastAPI + DynamoDB single-table on AWS Lambda

Parameters:
  ApiKey:
    Type: String
    NoEcho: true
    Description: Shared secret for X-API-Key header authentication
    # An empty API_KEY disables the header check, which is wanted for a local
    # run against DynamoDB Local and never for a public API Gateway URL. There
    # is deliberately no condition here allowing an empty value: CloudFormation
    # rejects the deploy instead, so the open path cannot be reached by
    # deploying. Do not relax this to make a deploy easier.
    MinLength: 16
  Environment:
    Type: String
    Default: prod
    Description: Deployment environment name

Globals:
  Function:
    # Coupled to the desktop client's 20s client-side timeout: Lambda must give
    # up first so a slow request surfaces as a clean 504 from API Gateway rather
    # than an ambiguous abort on the client, which cannot tell a lost request
    # from a lost reply. Change one of these two numbers and you must change the
    # other.
    Timeout: 15
    # Lambda scales CPU with memory, so this is a cold-start setting, not a
    # headroom setting: 1024 MB roughly halves FastAPI + mangum + boto3 import
    # time (~2s -> ~1s). Duration billing is per GB-ms, so paying double the
    # rate for half the time is close to cost-neutral.
    MemorySize: 1024
    Runtime: python3.13

Resources:
  # DynamoDB Single Table
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-table"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # HTTP API Gateway
  #
  # Deliberately no CorsConfiguration. The only client is a desktop Python
  # process, which sends no Origin header and for which CORS does nothing.
  # AllowOrigins "*" would not help it and would let any webpage in any open
  # browser tab fetch() this API, DELETE included. If a browser client ever
  # needs access, add it back with that specific origin - never a wildcard.
  ProjectTrackerApi:
    Type: AWS::Serverless::HttpApi

  # Lambda Function
  ProjectTrackerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.main.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref ProjectsTable
          API_KEY: !Ref ApiKey
          ENVIRONMENT: !Ref Environment
      ReservedConcurrentExecutions: 5
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ProjectsTable
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProjectTrackerApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProjectTrackerApi
            Path: /{proxy+}
            Method: ANY

  # CloudWatch Log Group with 14-day retention
  ProjectTrackerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectTrackerFunction}"
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL of the deployed HTTP API Gateway
    Value: !Sub "https://${ProjectTrackerApi}.execute-api.${AWS::Region}.amazonaws.com"
  HealthUrl:
    Description: Unauthenticated health check endpoint
    Value: !Sub "https://${ProjectTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/health"
  DocsUrl:
    Description: Interactive OpenAPI documentation (disabled when Environment=prod)
    Value: !Sub "https://${ProjectTrackerApi}.execute-api.${AWS::Region}.amazonaws.com/docs"
  TableName:
    Description: DynamoDB Table Name
    Value: !Ref ProjectsTable
