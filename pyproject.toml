[project]
name = "project-tracker"
version = "0.1.0"
description = "Side Project Tracker API"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Ajit Shetti", email = "ajitpshetti@gmail.com" }
]
dependencies = [
    "fastapi",
    "mangum",
    "pydantic",
    "pydantic-settings",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "uvicorn",
    "pytest",
    "httpx",
    "moto[dynamodb]",
    "ruff",
]

[tool.pytest.ini_options]
# app/ now lives under src/ so that CodeUri: src/ packages only deployable
# code. Put it on sys.path for tests, which still import `app.*`.
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RET"]
ignore = ["B008"]  # Allow FastAPI Depends and Query in function argument defaults

